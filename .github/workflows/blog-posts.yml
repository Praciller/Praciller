name: Refresh latest notes

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest Dream Logs Data notes
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dreamlogsdata.com/rss.xml"
          max_post_count: 3
          commit_message: "chore: refresh latest notes"
          enable_keepalive: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}